name: filazap-test

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: filazap
      POSTGRES_PASSWORD: filazap
      POSTGRES_DB: filazap_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filazap -d filazap_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.test
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://filazap:filazap@postgres:5432/filazap_test
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run test:all"
