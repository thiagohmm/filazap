name: filazap

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filazap
      POSTGRES_PASSWORD: filazap
      POSTGRES_DB: filazap
    # Bind em 127.0.0.1: não expor o banco para a rede (S8)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filazap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filazap -d filazap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["optional"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["optional"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  whatsapp-mock:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp-mock
    restart: unless-stopped
    # Bind em 127.0.0.1: o mock é apenas para desenvolvimento local (S8)
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://filazap:filazap@postgres:5432/filazap
      WHATSAPP_API_URL: http://whatsapp-mock:4000/graph
      MEDIA_STORAGE_DRIVER: local
      SEED_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mídia (imagens, áudios, documentos) persiste entre rebuilds do container
      - filazap_media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-mock:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  filazap_pgdata:
  filazap_media:
